services:
  web:
    build: .
    container_name: flask-web
    ports:
      - "8087:80"
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://admin:mysecret123@mongo:27017

  mongo:
    image: mongo:7
    container_name: flask-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
